localMode: false
image: {tag: "", digest: "", pullPolicy: IfNotPresent}
env:
  CATALOG_SERVICE_URL: http://catalog-service.govbiz-msa.svc.cluster.local:8081
  AI_SERVICE_BASE_URL: http://ai-service.govbiz-msa.svc.cluster.local:8000
  # Queue activation and its password are supplied by the deployment environment.
  RABBITMQ_HOST: rabbitmq.govbiz-msa.svc.cluster.local
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: govbiz
  RABBITMQ_VHOST: govbiz
  # Browser-facing loopback origin of the static Kubernetes web, not a Pod address.
  APP_CORS_ALLOWED_ORIGIN: http://localhost:18173
  ACCOUNT_OAUTH_CALLBACK_BASE_URL: http://localhost:18173
  ACCOUNT_OAUTH_FRONTEND_BASE_URL: http://localhost:18173
  DAILY_REPORT_FRONTEND_BASE_URL: http://localhost:18173
  LANGFUSE_ENABLED: "true"
  LANGFUSE_BASE_URL: http://langfuse-web.govbiz-observability.svc.cluster.local:3000
  LANGFUSE_ENVIRONMENT: development
secretName: core-runtime
secretKeys: [SPRING_DATASOURCE_PASSWORD, ACCOUNT_JWT_SECRET, CATALOG_INTERNAL_TOKEN, DOCUMENT_INTERNAL_TOKEN, ASSISTANT_TOOLS_TOKEN, LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY]
