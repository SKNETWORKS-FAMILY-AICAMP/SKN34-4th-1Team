# Restore these stores and supply their names in a private values file first.
# Empty names intentionally fail rendering; no empty replacement volumes are created.
allowDisposableData: false
existingClaims:
  core-mysql: ""
  catalog-mysql: ""
  ops-mysql: ""
  redis: ""
  qdrant: ""
  elasticsearch: ""
stores:
  elasticsearch:
    pullPolicy: IfNotPresent
