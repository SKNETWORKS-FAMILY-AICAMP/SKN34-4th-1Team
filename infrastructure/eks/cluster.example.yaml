# Proposal only. Confirm account, region, cost and administrator CIDR before create.
# Copy to infrastructure/gitops/.local/eks/cluster.yaml for the selected account.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: govbiz-eks
  region: ap-northeast-2
  # Set a version supported by EKS in the chosen region on deployment day.
  # Local kind's Kubernetes version is not an EKS availability guarantee.
  version: 'REPLACE_WITH_SUPPORTED_EKS_VERSION'
  tags:
    project: govbiz
    environment: first-deployment

# The control plane needs two AZs; the initial data node is intentionally single-AZ.
availabilityZones: [ap-northeast-2a, ap-northeast-2c]
vpc:
  cidr: 10.80.0.0/16
  clusterEndpoints: {publicAccess: true, privateAccess: true}
  # Documentation address: replace with the administrator's current public IP/32.
  publicAccessCIDRs: [203.0.113.1/32]
  nat: {gateway: Single}

accessConfig:
  authenticationMode: API_AND_CONFIG_MAP
  bootstrapClusterCreatorAdminPermissions: true

addonsConfig:
  autoApplyPodIdentityAssociations: true
addons:
  - name: eks-pod-identity-agent
  - name: vpc-cni
    configurationValues: '{"enableNetworkPolicy":"true"}'
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver

managedNodeGroups:
  - name: workloads
    instanceType: m6i.xlarge
    amiFamily: AmazonLinux2023
    availabilityZones: [ap-northeast-2a]
    privateNetworking: true
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    volumeType: gp3
    volumeSize: 80
    volumeEncrypted: true
    disableIMDSv1: true
    disablePodIMDS: true
    # Preserve the existing Elasticsearch mmap requirement across node replacement.
    preBootstrapCommands:
      - |
        set -eu
        echo 'vm.max_map_count=1048576' > /etc/sysctl.d/99-govbiz-elasticsearch.conf
        sysctl -p /etc/sysctl.d/99-govbiz-elasticsearch.conf
    ssh: {allow: false}
    labels: {govbiz.io/workload-pool: primary}
    tags: {project: govbiz, environment: first-deployment}

cloudWatch:
  clusterLogging:
    enableTypes: [api, audit, authenticator]
    logRetentionInDays: 7
