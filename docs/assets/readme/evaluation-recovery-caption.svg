<svg xmlns="http://www.w3.org/2000/svg" width="820" height="76" viewBox="0 0 820 76" role="img" aria-labelledby="title description">
  <title id="title">결과 확인·검토·복구</title>
  <desc id="description">완료된 결과를 검토하고 합격한 실행을 비교 기준으로 지정합니다. 응답이 저장된 후 보고서·점수 등록만 실패했다면, 캡처를 검증해 후처리를 복구할 수 있습니다.</desc>
  <style>
    text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .accent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .accent { fill: #4493f8; }
    }
  </style>
  <rect class="accent" x="0" y="4" width="4" height="64" rx="2" />
  <text x="20" y="20" font-size="15" font-weight="600">결과 확인·검토·복구</text>
  <text x="20" y="42" font-size="13">완료된 결과를 검토하고 합격한 실행을 비교 기준으로 지정합니다.</text>
  <text x="20" y="62" font-size="13">응답이 저장된 후 보고서·점수 등록만 실패했다면, 캡처를 검증해 후처리를 복구할 수 있습니다.</text>
</svg>
